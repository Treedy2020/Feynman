<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Feynman · Project Workspace Prototype</title>
  <meta name="description" content="按 Project 管理 Agent、Schedule、观测源与 Workspace 的 Feynman 可点击 UI Prototype。">
  <!-- THROWAWAY PROTOTYPE: three project-first layouts, switchable with ?variant=A|B|C. Open this file directly. No API calls or persistence. -->
  <style>
    :root { color-scheme:light; --bg:#fff; --canvas:#f7f8f6; --ink:#202520; --muted:#66716a; --line:#e4e8e3; --accent:#087f5b; --accent-soft:#edf7f0; --warn:#9b6b19; --warn-soft:#fff6e5; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--canvas); font-size:14px; } button,input,select { font:inherit; } button { cursor:pointer; } :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    h1,h2,h3,p { margin-top:0; } h1 { font-size:30px; letter-spacing:-.04em; } h2 { font-size:20px; letter-spacing:-.03em; } h3 { font-size:14px; } p { line-height:1.6; } .muted { color:var(--muted); } .small { font-size:11px; } .eyebrow { color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; } .row { display:flex; align-items:center; gap:10px; } .between { justify-content:space-between; } .wrap { flex-wrap:wrap; } .grow { flex:1; min-width:0; }
    .banner { display:flex; justify-content:space-between; gap:14px; padding:8px 18px; background:#24322b; color:#e7f1e9; font-size:11px; } .banner a { color:#bbebd0; }
    .project-picker { max-width:920px; margin:0 auto; padding:66px 24px 60px; } .project-picker h1 { margin:8px 0; } .project-picker .picker-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:25px; } .project-picker .picker-item { display:flex; align-items:center; gap:13px; width:100%; border:1px solid var(--line); border-radius:11px; background:#fff; padding:19px; text-align:left; } .project-picker .picker-item:hover { border-color:#91bfa0; background:#fcfffd; } .project-picker .picker-item strong { display:block; font-size:14px; } .project-picker .picker-item small { display:block; color:var(--muted); font-size:11px; margin-top:4px; } .project-picker .picker-item .arrow { margin-left:auto; color:var(--accent); }
    .app { min-height:calc(100vh - 34px); padding-bottom:85px; } .card { border:1px solid var(--line); border-radius:10px; padding:17px; background:#fff; min-width:0; } .card h3 { margin:0 0 8px; } .card p { color:var(--muted); font-size:12px; margin-bottom:8px; } .card p:last-child { margin-bottom:0; }
    .button { border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink); padding:8px 11px; font-size:11px; font-weight:600; } .button:hover { background:var(--canvas); } .button.primary { color:#fff; background:var(--ink); border-color:var(--ink); } .button.primary:hover { background:#3a453d; } .button:disabled { opacity:.45; cursor:not-allowed; } .button.link { border:0; background:transparent; color:var(--accent); padding:3px 0; }
    .badge { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:99px; color:var(--muted); background:#fff; padding:4px 9px; font-size:10px; white-space:nowrap; } .badge::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); } .badge.warning { background:var(--warn-soft); color:var(--warn); border-color:#f0dfb9; } .badge.warning::before { background:#d29a2c; } .badge.off::before { background:#aeb5af; }
    .initial { display:grid; place-items:center; width:29px; height:29px; border:1px solid #cde4d3; border-radius:7px; background:var(--accent-soft); color:var(--accent); font-size:11px; font-weight:700; flex:none; }
    .nav-button,.project-button { border:0; border-radius:7px; background:transparent; color:var(--muted); text-align:left; padding:9px 10px; font-size:12px; width:100%; } .nav-button:hover,.project-button:hover,.nav-button.active,.project-button.active { background:#eaf0eb; color:var(--ink); } .nav-button.active,.project-button.active { font-weight:650; } .project-button { display:flex; align-items:center; gap:9px; }
    .list { display:grid; gap:9px; } .item { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px; border:1px solid var(--line); border-radius:8px; background:#fff; } .item:hover { border-color:#b8d6c1; } .item strong { font-size:12px; } .item p { margin:4px 0 0; color:var(--muted); font-size:11px; } .item .button { flex:none; }
    .stat-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; } .stat { border:1px solid var(--line); background:#fff; border-radius:9px; padding:13px 15px; } .stat span { display:block; color:var(--muted); font-size:10px; } .stat strong { display:block; font-size:22px; margin-top:3px; font-weight:600; }
    .section-title { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:22px 0 11px; } .section-title h2 { margin:0; } .section-title span { color:var(--muted); font-size:11px; }
    .notice { background:var(--warn-soft); border:1px solid #edddb9; border-radius:9px; padding:13px 15px; font-size:11px; } .notice p { margin:5px 0 0; } .empty { border:1px dashed var(--line); border-radius:9px; padding:26px; color:var(--muted); font-size:12px; background:var(--canvas); }
    .chat { display:flex; flex-direction:column; gap:13px; min-height:285px; padding:19px 0; } .bubble { max-width:83%; padding:11px 13px; border-radius:9px; background:#f3f5f2; line-height:1.6; font-size:12px; } .bubble.mine { align-self:flex-end; background:#e9f4ec; } .bubble small { display:block; color:var(--muted); font-size:10px; margin-bottom:4px; } .composer { display:flex; gap:8px; } .composer input { min-width:0; flex:1; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:12px; }
    .agent-tabs { display:flex; gap:6px; flex-wrap:wrap; padding-bottom:15px; border-bottom:1px solid var(--line); } .agent-tabs button { border:1px solid var(--line); border-radius:7px; background:#fff; padding:8px 11px; font-size:11px; color:var(--muted); } .agent-tabs button.active { border-color:#86b999; background:var(--accent-soft); color:var(--ink); font-weight:650; }
    .details-grid { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(235px,.8fr); gap:14px; } .detail-line { display:flex; justify-content:space-between; gap:12px; border-top:1px solid var(--line); padding:9px 0; font-size:11px; } .detail-line span:first-child { color:var(--muted); } .detail-line strong { text-align:right; font-weight:600; }
    .select { border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); padding:6px 8px; font-size:11px; max-width:180px; } .event { border-left:2px solid #d6e2d8; padding:1px 0 16px 16px; font-size:11px; position:relative; } .event::before { content:""; position:absolute; left:-6px; top:2px; width:8px; height:8px; border-radius:50%; background:var(--accent); } .event small { display:block; color:var(--muted); margin-bottom:4px; } .event b { font-size:12px; } .event p { color:var(--muted); margin:4px 0; }
    /* A: project sidebar → agent conversation, with project tools around it. */
    .variant-a { display:grid; grid-template-columns:222px minmax(430px,1fr) 274px; min-height:calc(100vh - 34px); max-width:1640px; margin:auto; background:#fff; border-inline:1px solid var(--line); }
    .a-nav { background:#f5f6f3; border-right:1px solid var(--line); padding:20px 12px; } .brand { font-size:17px; font-weight:700; letter-spacing:-.04em; } .a-nav .brand { padding:0 9px 18px; } .side-label { color:var(--muted); font-size:10px; letter-spacing:.07em; text-transform:uppercase; padding:19px 10px 7px; }
    .a-main { padding:28px 34px 45px; min-width:0; } .a-main h1 { margin:6px 0; } .a-aside { border-left:1px solid var(--line); background:#fafbf9; padding:20px 16px; } .a-aside .card { margin-bottom:12px; }
    /* B: project portfolio and operations board, still rooted inside selected Project. */
    .variant-b { max-width:1480px; margin:auto; padding:0 29px 45px; } .b-top { display:flex; align-items:center; justify-content:space-between; gap:18px; min-height:75px; border-bottom:1px solid var(--line); } .b-top nav { display:flex; gap:5px; flex-wrap:wrap; } .b-project { padding:31px 0 23px; } .b-project h1 { margin:7px 0; } .b-layout { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(290px,.8fr); gap:18px; } .b-main { min-width:0; } .b-aside { position:sticky; top:16px; align-self:start; } .b-tabs { display:flex; gap:7px; overflow:auto; border-bottom:1px solid var(--line); padding-bottom:13px; margin-bottom:19px; } .b-tabs .button.active { background:var(--ink); color:#fff; }
    /* C: project tree → evidence timeline → selected object. */
    .variant-c { display:grid; grid-template-columns:250px minmax(410px,1fr) 312px; min-height:calc(100vh - 34px); max-width:1660px; margin:auto; background:#fff; border-inline:1px solid var(--line); } .c-tree { background:#fafbf9; border-right:1px solid var(--line); padding:21px 12px; } .c-tree .brand { padding:0 9px 17px; } .tree-child { margin-left:18px; border-left:1px solid var(--line); padding-left:7px; } .c-main { padding:30px 36px 50px; min-width:0; } .c-main h1 { margin:7px 0; } .c-aside { background:#f6f8f5; border-left:1px solid var(--line); padding:22px 16px; } .c-aside .card { margin-bottom:12px; }
    .switcher { position:fixed; z-index:50; bottom:15px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:11px; border-radius:99px; padding:6px; color:white; background:#202a22; box-shadow:0 12px 32px #14211780; white-space:nowrap; } .switcher button { width:33px; height:33px; border:0; border-radius:50%; background:#37483b; color:white; } .switcher button:hover { background:#52705a; } .switcher span { min-width:165px; text-align:center; font-size:11px; } .switcher small { color:#b8cbbb; font-size:10px; }
    .state-debug { max-width:1400px; margin:0 auto 100px; padding:0 20px; } .state-debug summary { cursor:pointer; color:var(--muted); font-size:11px; } .state-debug pre { overflow:auto; border-radius:8px; padding:14px; background:#e8ece8; font-size:10px; }
    @media(max-width:1160px) { .variant-a,.variant-c { grid-template-columns:190px minmax(400px,1fr); } .a-aside,.c-aside { grid-column:2; border-left:0; border-top:1px solid var(--line); } .b-layout { grid-template-columns:1fr; } .b-aside { position:static; } }
    @media(max-width:760px) { .variant-a,.variant-c { display:block; } .a-nav,.c-tree { border-right:0; border-bottom:1px solid var(--line); } .a-main,.c-main { padding:22px 18px 46px; } .a-aside,.c-aside { padding:18px; } .variant-b { padding:0 15px 40px; } .b-top { flex-wrap:wrap; padding:12px 0; } .stat-grid,.project-picker .picker-list { grid-template-columns:1fr; } .details-grid { grid-template-columns:1fr; } .banner { align-items:start; } }
  </style>
</head>
<body data-prototype="true">
  <div class="banner"><span><strong>PROJECT-FIRST UI PROTOTYPE</strong>　示例中的多 Agent 是未来目标；当前 Rust V1 仍为每项目单 Agent。所有操作只改页面内存，不连接服务。</span><a href="visual-console.html">架构设计 ↗</a></div>
  <div id="app" class="app"></div>
  <details class="state-debug" open><summary>查看完整模拟状态（刷新即重置）</summary><pre id="state-json" aria-live="polite"></pre></details>
  <div class="switcher" role="group" aria-label="切换项目工作台设计方案">
    <button type="button" data-cycle="-1" aria-label="上一方案，键盘左箭头">←</button>
    <span id="variant-label"></span>
    <button type="button" data-cycle="1" aria-label="下一方案，键盘右箭头">→</button>
  </div>
  <script>
    (() => {
      "use strict";
      const variants = ["A", "B", "C"];
      const names = { A:"项目侧栏 + Agent 对话", B:"项目运营首页", C:"项目树 + 事件证据" };
      const tabs = [
        ["overview","项目概览"], ["agents","Agent 与会话"], ["schedules","Schedule"],
        ["sources","观测信息源"], ["workspace","Workspace"], ["activity","活动与投递"]
      ];
      const seed = () => ({
        feynman: {
          name:"Feynman", workspace:"running", approval:"waiting", delivery:"unknown",
          agents:[
            { id:"main", name:"Main Agent", role:"项目实施与协调", status:"active", messages:[{by:"user",text:"看看项目现在有什么需要处理的。"},{by:"agent",text:"我会先核对 Schedule、观测源和执行环境。投递结果未知时先对账，不盲目重发。"}] },
            { id:"observer", name:"Observer", role:"外部事实观察 · 目标模型", status:"active", messages:[{by:"user",text:"关注授权群里的新反馈。"},{by:"agent",text:"我会按绑定的 Schedule 收集窗口，并在有变化时解释来源。"}] }
          ],
          schedules:[{id:"dws-watch",name:"DWS 群消息窗口",target:"observer",source:"DWS / 群反馈",window:"30 分钟",status:"active"},{id:"daily",name:"每日项目检查",target:"main",source:"定时",window:"每天 09:00",status:"paused"}],
          sources:[{id:"dws",name:"DWS · 群反馈",status:"authorized",scope:"指定群 / 只读",grants:["observer"]},{id:"gitlab",name:"GitLab · 仓库",status:"authorized",scope:"指定仓库 / 只读",grants:["main"]}],
          events:["Schedule 窗口封窗 · DWS 群反馈 · 投递给 Observer","投递结果未知 · 等待对账","Main Agent Run 等待审批"]
        },
        lab: {
          name:"实验室", workspace:"stopped", approval:"none", delivery:"pending",
          agents:[{id:"research",name:"Research Agent",role:"研究与复现",status:"disabled",messages:[{by:"agent",text:"运行环境已停止，等待用户恢复。"}]}],
          schedules:[{id:"bad-cases",name:"复现 bad cases",target:"research",source:"定时",window:"每半天",status:"paused"}],
          sources:[{id:"dws-lab",name:"DWS · 实验室群",status:"waiting",scope:"待用户认证",grants:[]}],
          events:["Workspace 已停止","Agent 已停用；Schedule 暂停","观测源待完成授权"]
        },
        notes: { name:"Notes",workspace:"none",approval:"none",delivery:"none",agents:[],schedules:[],sources:[],events:["项目已创建；尚无 Agent"] }
      });
      const requested = new URLSearchParams(location.search).get("variant");
      const state = { variant:variants.includes(requested)?requested:"B", scope:"projects", project:"feynman", tab:"overview", agent:"main", projects:seed(), lastAction:"打开项目列表" };
      const esc = value => String(value).replace(/[&<>"']/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[char]);
      const project = () => state.projects[state.project];
      const agent = () => project().agents.find(item => item.id===state.agent && item.status!=="archived") || null;
      const activeAgents = () => project().agents.filter(item=>item.status!=="archived");
      const status = value => ({active:"已启用",disabled:"已停用",archived:"已归档",paused:"已暂停",running:"运行中",stopped:"已停止",none:"未配置",authorized:"已认证",waiting:"待授权",unknown:"结果未知",pending:"待投递",accepted:"已接收",approved:"已批准"})[value] || value;
      const approvalStatus = value => value==="waiting"?"待审批":status(value);
      const badge = value => `<span class="badge ${["waiting","unknown"].includes(value)?"warning":["none","disabled","archived","paused","stopped"].includes(value)?"off":""}">${esc(status(value))}</span>`;
      const count = key => ({agents:activeAgents().length,schedules:project().schedules.length,sources:project().sources.length})[key];
      const projectButtons = () => Object.entries(state.projects).map(([id,item])=>`<button class="picker-item" type="button" data-project="${id}"><span class="initial">${esc(item.name[0])}</span><span><strong>${esc(item.name)}</strong><small>进入 Project 工作区</small></span><span class="arrow">→</span></button>`).join("");
      const projectPicker = () => `<main class="project-picker"><div class="eyebrow">Feynman / Projects</div><h1>选择一个项目</h1><p class="muted small">全局层只负责列出和创建 Project。项目概览、Agent、Schedule、观测源和 Workspace 都在进入项目之后管理。</p><div class="picker-list">${projectButtons()}</div><button class="button" type="button" data-action="add-project" style="margin-top:17px">＋ 新建项目（模拟）</button></main>`;
      const tabButtons = className => tabs.map(([id,name])=>`<button class="${className} ${state.tab===id?"active":""}" type="button" data-tab="${id}">${name}</button>`).join("");
      const eventRows = () => project().events.map((item,index)=>`<div class="event"><small>今天 · 事件 ${project().events.length-index}</small><b>${esc(item)}</b><p>项目 ${esc(project().name)} · 来源与目标均可下钻查看</p></div>`).join("");
      const attention = () => `<div class="notice"><strong>需要用户处理</strong><p>审批：${approvalStatus(project().approval)}　·　投递：${status(project().delivery)}。状态不确定时必须先对账。</p><div class="row wrap" style="margin-top:9px"><button class="button" type="button" data-action="approve" ${project().approval!=="waiting"?"disabled":""}>模拟批准</button><button class="button" type="button" data-action="reconcile" ${project().delivery!=="unknown"?"disabled":""}>模拟对账</button></div></div>`;
      const projectSummary = () => `<div class="stat-grid"><div class="stat"><span>Project Agents</span><strong>${count("agents")}</strong></div><div class="stat"><span>Schedules</span><strong>${count("schedules")}</strong></div><div class="stat"><span>观测信息源</span><strong>${count("sources")}</strong></div><div class="stat"><span>Workspace</span><strong style="font-size:16px;margin-top:9px">${status(project().workspace)}</strong></div></div>`;
      const overview = () => `<section><div class="section-title"><h2>项目概览</h2><span>所有对象都归属 ${esc(project().name)}</span></div>${projectSummary()}<div class="details-grid" style="margin-top:15px"><div class="card"><h3>Agent</h3>${activeAgents().length?activeAgents().map(item=>`<div class="item"><div class="row"><span class="initial">${esc(item.name[0])}</span><div><strong>${esc(item.name)}</strong><p>${esc(item.role)} · ${status(item.status)}</p></div></div><button class="button" type="button" data-agent="${esc(item.id)}">进入会话 →</button></div>`).join(""):`<div class="empty">尚无 Agent。项目可以先创建，再由用户添加 Agent。</div>`}<div class="row wrap" style="margin-top:13px"><button class="button" type="button" data-tab="agents">管理 Agents</button><button class="button" type="button" data-action="add-agent">模拟添加 Agent</button></div></div><div class="card"><h3>项目状态</h3><div class="detail-line"><span>Workspace</span><strong>${status(project().workspace)}</strong></div><div class="detail-line"><span>Schedule</span><strong>${project().schedules.filter(item=>item.status==="active").length} 条运行中</strong></div><div class="detail-line"><span>观测源</span><strong>${project().sources.filter(item=>item.status==="authorized").length} 个已认证</strong></div><div class="detail-line"><span>投递</span><strong>${status(project().delivery)}</strong></div><button class="button" type="button" data-tab="activity" style="margin-top:12px">查看活动与投递 →</button></div></div><div style="margin-top:15px">${attention()}</div></section>`;
      const conversation = item => `<div class="chat">${item.messages.map(message=>`<div class="bubble ${message.by==="user"?"mine":""}"><small>${message.by==="user"?"你":"Agent"} · 模拟消息</small>${esc(message.text)}</div>`).join("")}</div><form class="composer" id="mock-send"><input name="message" maxlength="240" placeholder="向 ${esc(item.name)} 发送模拟消息…" aria-label="发送模拟消息" ${item.status!=="active"?"disabled":""}><button class="button primary" type="submit" ${item.status!=="active"?"disabled":""}>模拟发送</button></form>`;
      const agents = () => `<section><div class="section-title"><h2>项目 Agents</h2><button class="button" type="button" data-action="add-agent">＋ 模拟添加 Agent</button></div><p class="small muted">每个 Agent 有自己的长期 Session 和 Conversation，使用同一 Project Workspace；权限不因共享项目而自动继承。多 Agent 目前仅为目标模型。</p>${activeAgents().length?`<div class="agent-tabs">${activeAgents().map(item=>`<button class="${agent()?.id===item.id?"active":""}" type="button" data-agent="${esc(item.id)}">${esc(item.name)} · ${status(item.status)}</button>`).join("")}</div>${agent()?`<div class="details-grid" style="margin-top:15px"><div class="card"><div class="row between wrap"><div><div class="eyebrow">${esc(project().name)} / ${esc(agent().name)}</div><h2 style="margin:8px 0 0">与 ${esc(agent().name)} 沟通</h2></div>${badge(agent().status)}</div>${conversation(agent())}</div><div class="card"><h3>Agent 资料与控制</h3><div class="detail-line"><span>角色</span><strong>${esc(agent().role)}</strong></div><div class="detail-line"><span>长期会话</span><strong>Session / ${esc(agent().id)}</strong></div><div class="detail-line"><span>绑定 Schedule</span><strong>${project().schedules.filter(item=>item.target===agent().id).length} 条</strong></div><div class="detail-line"><span>已授权观测源</span><strong>${project().sources.filter(item=>item.grants.includes(agent().id)).length} 个</strong></div><div class="row wrap" style="margin-top:13px"><button class="button" type="button" data-action="toggle-agent">${agent().status==="active"?"模拟停用":"模拟启用"}</button><button class="button" type="button" data-action="archive-agent">模拟归档</button></div><p class="small muted" style="margin-top:13px">停用会暂停其 Schedule；归档保留会话与审计记录。</p></div></div>`:""}`:`<div class="empty">这个项目尚无 Agent。点击上方按钮模拟创建。</div>`}</section>`;
      const schedules = () => `<section><div class="section-title"><h2>项目 Schedules</h2><button class="button" type="button" data-action="add-schedule" ${!activeAgents().length?"disabled":""}>＋ 模拟新建 Schedule</button></div><p class="small muted">Schedule 属于项目；每条规则固定绑定一个 Agent ID，按整条 Schedule 开窗。更改项目默认 Agent 不会暗中改派既有规则。</p><div class="list">${project().schedules.map(item=>`<div class="item"><div class="grow"><div class="row wrap"><strong>${esc(item.name)}</strong>${badge(item.status)}</div><p>来源 ${esc(item.source)} · 窗口 ${esc(item.window)} · 目标 Agent</p><select class="select" data-bind-schedule="${esc(item.id)}" aria-label="${esc(item.name)} 的目标 Agent">${project().agents.map(person=>`<option value="${esc(person.id)}" ${person.id===item.target?"selected":""} ${person.status==="archived"?"disabled":""}>${esc(person.name)}${person.status==="archived"?"（已归档）":""}</option>`).join("")}</select></div><button class="button" type="button" data-schedule="${esc(item.id)}">${item.status==="active"?"模拟暂停":"模拟启用"}</button></div>`).join("")||`<div class="empty">暂无 Schedule。先为项目创建 Agent，才能给规则绑定目标。</div>`}</div><div class="notice" style="margin-top:16px"><strong>监听与历史补查</strong><p>本页只模拟窗口和目标绑定；真实监听水位、空窗及有界 backfill 仍需后端实现。</p></div></section>`;
      const sources = () => `<section><div class="section-title"><h2>项目观测信息源</h2><button class="button" type="button" data-action="add-source">＋ 模拟添加来源</button></div><p class="small muted">Connection 由用户持有，Project Binding 指定资源范围，Agent Grant 再决定哪个 Agent 能读取。这里不展示 Token。</p><div class="list">${project().sources.map(item=>`<div class="card"><div class="row between wrap"><div><h3 style="margin:0">${esc(item.name)}</h3><p style="margin:3px 0 0">Project Binding · ${esc(item.scope)}</p></div>${badge(item.status)}</div><div class="detail-line"><span>Agent Grants</span><strong>${item.grants.length?item.grants.map(id=>project().agents.find(person=>person.id===id)?.name||id).join("、"):"尚未授予"}</strong></div><div class="row wrap" style="margin-top:11px"><button class="button" type="button" data-source="${esc(item.id)}">${item.status==="authorized"?"模拟停用连接":"模拟完成认证"}</button><button class="button" type="button" data-grant="${esc(item.id)}" ${!agent()||agent().status!=="active"||item.status!=="authorized"?"disabled":""}>${agent()&&item.grants.includes(agent().id)?"撤销":"授予"}当前 Agent</button></div></div>`).join("")||`<div class="empty">此项目还没有观测源。可以先创建项目与 Agent，再由用户接入 DWS 等来源。</div>`}</div></section>`;
      const workspace = () => `<section><div class="section-title"><h2>Project Workspace</h2>${badge(project().workspace)}</div><div class="details-grid"><div class="card"><h3>执行环境与持久文件</h3><p>Workspace 属于项目，不属于某个 Agent。多个 Agent 可以拥有独立会话但共用项目的可恢复文件系统。</p><div class="detail-line"><span>Provider</span><strong>${project().workspace==="none"?"未配置":"OpenSandbox / Docker"}</strong></div><div class="detail-line"><span>项目目录</span><strong>${project().workspace==="none"?"—":"/workspace"}</strong></div><div class="detail-line"><span>文件浏览</span><strong>设计预留 · 待受控接口</strong></div><button class="button" type="button" data-action="workspace" style="margin-top:14px">${project().workspace==="running"?"模拟停止":project().workspace==="stopped"?"模拟恢复":"模拟创建"}</button></div><div class="card"><h3>文件与会话分离</h3><p>代码、仓库和卷内依赖留在项目 Workspace；Codex 原生日志留在本地 Feynman Home。浏览器不会直接访问沙盒文件或执行端点。</p><div class="empty">文件树将在后端提供受限只读接口后接入。</div></div></div></section>`;
      const activity = () => `<section><div class="section-title"><h2>项目活动与投递</h2><span>对话、Schedule、授权与执行证据汇合</span></div><div class="details-grid"><div class="card"><h3>事件时间线</h3>${eventRows()}</div><div><div class="card"><h3>投递状态</h3><div class="detail-line"><span>最近消息</span>${badge(project().delivery)}</div><p>unknown 表示运行时可能已接收；必须对账后才能判定是否重试。</p><button class="button" type="button" data-action="reconcile" ${project().delivery!=="unknown"?"disabled":""}>模拟对账成功</button></div><div style="margin-top:12px">${attention()}</div></div></div></section>`;
      const sections = {overview,agents,schedules,sources,workspace,activity};
      const section = () => sections[state.tab]();
      const contextCard = () => `<div class="card"><div class="eyebrow">PROJECT / ${esc(project().name)}</div><h3 style="margin:8px 0 3px">当前项目</h3><div class="detail-line"><span>Agents</span><strong>${count("agents")}</strong></div><div class="detail-line"><span>Schedules</span><strong>${count("schedules")}</strong></div><div class="detail-line"><span>观测源</span><strong>${count("sources")}</strong></div><div class="detail-line"><span>Workspace</span><strong>${status(project().workspace)}</strong></div></div>`;
      const VariantA = () => `<div class="variant-a"><aside class="a-nav"><div class="brand">Feynman</div><button class="nav-button" type="button" data-back="projects">← 所有项目</button><div class="side-label">当前 Project</div><div class="card" style="padding:11px;margin:0 5px"><strong>${esc(project().name)}</strong><p class="small muted" style="margin:4px 0 0">独立项目工作区</p></div><div class="side-label">项目内管理</div>${tabButtons("nav-button")}<p class="small muted" style="padding:13px 10px">A · 进入项目后选择 Agent 会话，侧栏管理项目对象。</p></aside><main class="a-main"><div class="eyebrow">Projects / ${esc(project().name)} / ${tabs.find(([id])=>id===state.tab)[1]}</div><div class="row between wrap" style="margin:8px 0 23px"><div><h1>${esc(project().name)}</h1><p class="small muted" style="margin:0">一个 Project 拥有 Agents、Schedules、观测源和 Workspace。</p></div>${badge(project().workspace)}</div>${section()}</main><aside class="a-aside"><div class="eyebrow" style="margin-bottom:12px">项目上下文</div>${contextCard()}<div class="card"><h3>当前会话目标</h3><p>${agent()?esc(agent().name):"尚未选择 Agent"}</p><button class="button" type="button" data-tab="agents">选择 Agent →</button></div><div class="card"><h3>需要处理</h3><p>审批 ${approvalStatus(project().approval)} · 投递 ${status(project().delivery)}</p><button class="button" type="button" data-tab="activity">查看证据 →</button></div></aside></div>`;
      const VariantB = () => `<div class="variant-b"><header class="b-top"><div class="brand">Feynman <span class="small muted" style="font-weight:400">/ Projects / ${esc(project().name)}</span></div><button class="button" type="button" data-back="projects">← 所有项目</button><span class="badge">Local-first</span></header><div class="b-project"><div class="eyebrow">项目内 / ${esc(project().name)}</div><h1>${esc(project().name)} 的所有工作</h1><p class="small muted">项目概览、Agent 会话、Schedule、观测源和执行环境都在这个 Project 工作区内。</p></div><div class="b-layout"><main class="b-main"><div class="b-tabs">${tabButtons("button")}</div>${section()}</main><aside class="b-aside">${contextCard()}<div class="card" style="margin-top:12px"><h3>Agent 入口</h3>${activeAgents().map(item=>`<div class="item"><div><strong>${esc(item.name)}</strong><p>${status(item.status)}</p></div><button class="button" type="button" data-agent="${esc(item.id)}">进入 →</button></div>`).join("")||`<p>这个项目尚无 Agent。</p>`}</div><div style="margin-top:12px">${attention()}</div></aside></div></div>`;
      const VariantC = () => `<div class="variant-c"><aside class="c-tree"><div class="brand">Feynman / Explore</div><button class="nav-button" type="button" data-back="projects">← 所有项目</button><div class="side-label">当前 Project / ${esc(project().name)}</div><button class="nav-button ${state.tab==="overview"?"active":""}" data-tab="overview">项目概览</button><button class="nav-button ${state.tab==="agents"?"active":""}" data-tab="agents">Agents (${count("agents")})</button><div class="tree-child">${activeAgents().map(item=>`<button class="nav-button ${state.tab==="agents"&&state.agent===item.id?"active":""}" data-agent="${esc(item.id)}">↳ ${esc(item.name)}</button>`).join("")}</div><button class="nav-button ${state.tab==="schedules"?"active":""}" data-tab="schedules">Schedules (${count("schedules")})</button><button class="nav-button ${state.tab==="sources"?"active":""}" data-tab="sources">观测源 (${count("sources")})</button><button class="nav-button ${state.tab==="workspace"?"active":""}" data-tab="workspace">Workspace</button><button class="nav-button ${state.tab==="activity"?"active":""}" data-tab="activity">活动与投递</button><p class="small muted" style="padding:15px 10px">C · 项目对象树与事件证据并列，适合追踪来源和影响。</p></aside><main class="c-main"><div class="eyebrow">Projects / ${esc(project().name)} / ${tabs.find(([id])=>id===state.tab)[1]}</div><h1>${esc(project().name)}</h1><p class="small muted">Agent、规则、来源和环境是项目下的不同对象；点击左侧树逐级进入。</p>${section()}</main><aside class="c-aside"><div class="eyebrow" style="margin-bottom:12px">PROJECT EVIDENCE</div>${contextCard()}<div class="card"><h3>最近活动</h3>${eventRows()}<button class="button" type="button" data-tab="activity">查看全部 →</button></div></aside></div>`;
      function render() {
        document.title = `Feynman Project Workspace · Prototype ${state.variant}`;
        document.getElementById("app").innerHTML = state.scope==="projects" ? projectPicker() : ({A:VariantA,B:VariantB,C:VariantC})[state.variant]();
        document.getElementById("variant-label").innerHTML = `<b>${state.variant}</b> · ${names[state.variant]}<br><small>← → 切换 · 纯模拟</small>`;
        document.getElementById("state-json").textContent = JSON.stringify(state,null,2);
      }
      function switchVariant(value) {
        if (!variants.includes(value)) return;
        state.variant=value;
        state.tab={A:"agents",B:"overview",C:"activity"}[value];
        const url=new URL(location.href); url.searchParams.set("variant",value);
        try { history.replaceState(null,"",url); } catch (_) { location.href=url.href; return; }
        state.lastAction=`切换到方案 ${value}`; render();
      }
      function ensureAgent() { if (!agent()) state.agent=activeAgents()[0]?.id||""; }
      function act(action,id) {
        const item=project();
        if (action==="add-project") { const next="project-"+(Object.keys(state.projects).length+1); state.projects[next]={name:"新项目 "+(Object.keys(state.projects).length+1),workspace:"none",approval:"none",delivery:"none",agents:[],schedules:[],sources:[],events:["项目已创建"]}; state.project=next; state.agent=""; state.scope="project"; state.tab="overview"; }
        if (action==="add-agent") { const next="agent-"+(item.agents.length+1); item.agents.push({id:next,name:"New Agent "+(item.agents.length+1),role:"用户创建的长期 Agent",status:"active",messages:[]}); state.agent=next; state.tab="agents"; item.events.unshift("用户创建 Agent · "+next); }
        if (action==="toggle-agent" && agent()) { agent().status=agent().status==="active"?"disabled":"active"; if(agent().status==="disabled") item.schedules.filter(s=>s.target===agent().id).forEach(s=>s.status="paused"); item.events.unshift("Agent 状态变更 · "+agent().name); }
        if (action==="archive-agent" && agent()) { const old=agent(); old.status="archived"; item.schedules.filter(s=>s.target===old.id).forEach(s=>s.status="paused"); item.events.unshift("Agent 已归档 · "+old.name); ensureAgent(); }
        if (action==="add-schedule" && activeAgents().length) { const next="schedule-"+(item.schedules.length+1); item.schedules.push({id:next,name:"新 Schedule "+(item.schedules.length+1),target:agent()?.id||activeAgents()[0].id,source:"定时",window:"每小时",status:"paused"}); item.events.unshift("新建 Schedule · "+next); }
        if (action==="add-source") { const next="source-"+(item.sources.length+1); item.sources.push({id:next,name:"新观测源 "+(item.sources.length+1),status:"waiting",scope:"待用户指定范围",grants:[]}); item.events.unshift("新增观测源 · 待授权"); }
        if (action==="workspace") { item.workspace=item.workspace==="running"?"stopped":"running"; item.events.unshift("Workspace 状态 · "+status(item.workspace)); }
        if (action==="approve" && item.approval==="waiting") { item.approval="approved"; item.events.unshift("用户批准 Agent Run 请求"); }
        if (action==="reconcile" && item.delivery==="unknown") { item.delivery="accepted"; item.events.unshift("投递对账完成 · 已接收"); }
        state.lastAction=`${item.name} / ${action}${id?" / "+id:""}`;
      }
      document.addEventListener("click", event => {
        const target=event.target.closest("button"); if (!target) return;
        const data=target.dataset;
        if (data.cycle) return switchVariant(variants[(variants.indexOf(state.variant)+Number(data.cycle)+variants.length)%variants.length]);
        if (data.back==="projects") { state.scope="projects"; state.lastAction="返回项目列表"; return render(); }
        if (data.project) { state.project=data.project; state.scope="project"; state.agent=activeAgents()[0]?.id||""; state.tab="overview"; state.lastAction="进入项目 / "+project().name; return render(); }
        if (data.tab) { state.tab=data.tab; return render(); }
        if (data.agent) { state.agent=data.agent; state.tab="agents"; return render(); }
        if (data.schedule) { const rule=project().schedules.find(s=>s.id===data.schedule); if (rule) { const targetAgent=project().agents.find(a=>a.id===rule.target); if (rule.status==="active"||targetAgent?.status==="active") { rule.status=rule.status==="active"?"paused":"active"; project().events.unshift("Schedule 状态 · "+rule.name+" · "+status(rule.status)); } } return render(); }
        if (data.source) { const source=project().sources.find(s=>s.id===data.source); if (source) { source.status=source.status==="authorized"?"disabled":"authorized"; if(source.status==="disabled")source.grants=[]; project().events.unshift("观测源状态 · "+source.name+" · "+status(source.status)); } return render(); }
        if (data.grant) { const source=project().sources.find(s=>s.id===data.grant); if (source&&agent()&&agent().status==="active"&&source.status==="authorized") { source.grants=source.grants.includes(agent().id)?source.grants.filter(id=>id!==agent().id):[...source.grants,agent().id]; project().events.unshift("观测源 Grant 变更 · "+source.name+" / "+agent().name); } return render(); }
        if (data.action) { act(data.action); render(); }
      });
      document.addEventListener("change", event => {
        const id=event.target.dataset.bindSchedule; if (!id) return;
        const rule=project().schedules.find(s=>s.id===id); const target=project().agents.find(a=>a.id===event.target.value&&a.status!=="archived");
        if (rule&&target) { rule.target=target.id; if(target.status!=="active")rule.status="paused"; project().events.unshift("Schedule 目标已改为 "+target.name); state.lastAction="变更 Schedule 目标 / "+id; render(); }
      });
      document.addEventListener("submit", event => {
        if (event.target.id!=="mock-send") return; event.preventDefault();
        const text=event.target.elements.message.value.trim(); if (!text||!agent()||agent().status!=="active") return;
        agent().messages.push({by:"user",text}); project().events.unshift("向 "+agent().name+" 发送模拟消息"); state.lastAction="发送模拟消息 / "+agent().name; render();
      });
      document.addEventListener("keydown", event => {
        if (event.altKey||event.ctrlKey||event.metaKey||event.target.matches("input,textarea,select,[contenteditable]")) return;
        if (event.key==="ArrowLeft"||event.key==="ArrowRight") { event.preventDefault(); const delta=event.key==="ArrowLeft"?-1:1; switchVariant(variants[(variants.indexOf(state.variant)+delta+variants.length)%variants.length]); }
      });
      window.addEventListener("popstate",()=>{const value=new URLSearchParams(location.search).get("variant");if(variants.includes(value)){state.variant=value;state.tab={A:"agents",B:"overview",C:"activity"}[value];render();}});
      render();
    })();
  </script>
</body>
</html>
